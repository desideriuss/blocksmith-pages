<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blocksmith - Legal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
        }
        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 50px 60px;
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .logo {
            font-size: 64px;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .tagline {
            font-size: 15px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 40px;
        }
        a {
            display: block;
            padding: 16px 24px;
            margin: 12px 0;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .btn-tr {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .btn-tr:hover {
            background: rgba(255,255,255,0.18);
            transform: translateY(-2px);
        }
        .btn-en {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .btn-en:hover {
            background: rgba(255,255,255,0.18);
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 36px;
            font-size: 13px;
            color: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🧱</div>
        <h1>Blocksmith</h1>
        <p class="tagline">Legal & Privacy</p>
        <a href="privacy_policy.html" class="btn-tr">🇹🇷 Gizlilik Politikası</a>
        <a href="privacy_policy_en.html" class="btn-en">🇬🇧 Privacy Policy</a>
        <p class="footer">© 2026 Blocksmith. All rights reserved.</p>
    </div>
</body>
</html>
